<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Idle Code Redeemer{% endblock %}</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --border: #2c313a;
    --text: #e6e8eb; --muted: #99a1ad; --accent: #6ea8fe;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --border: #dfe3e8;
      --text: #1a1d21; --muted: #5c6672; --accent: #1a5fd0;
      --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 0 1.5rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; margin: 0; padding: 1rem 0; letter-spacing: .02em; }
  nav { display: flex; gap: 1rem; }
  nav a {
    color: var(--muted); text-decoration: none; padding: 1rem 0;
    border-bottom: 2px solid transparent;
  }
  nav a:hover { color: var(--text); }
  nav a.active { color: var(--text); border-bottom-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem;
  }
  .panel h2 { margin: 0 0 1rem; font-size: .95rem; text-transform: uppercase;
              letter-spacing: .06em; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
  .tile { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; }
  .tile .n { font-size: 1.6rem; font-weight: 600; }
  .tile .l { color: var(--muted); font-size: .85rem; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.code { font-family: ui-monospace, monospace; }
  form.inline { display: inline; }
  label { display: block; margin-bottom: .35rem; color: var(--muted); font-size: .85rem; }
  input[type=text], input[type=number], input[type=password], textarea, select {
    width: 100%; padding: .5rem .6rem; border-radius: 6px; font: inherit;
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
  }
  textarea { min-height: 90px; font-family: ui-monospace, monospace; }
  .field { margin-bottom: .9rem; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: .55rem 1rem; font: inherit; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:hover { filter: brightness(1.1); }
  .flash { padding: .7rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  .flash.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .flash.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .s-success, .s-ok { color: var(--ok); }
  .s-already_redeemed, .s-expired, .s-invalid, .s-cannot_redeem, .s-na { color: var(--muted); }
  .s-failed, .s-pending { color: var(--warn); }
  .muted { color: var(--muted); }
  .hint { color: var(--muted); font-size: .85rem; margin-top: .35rem; }
</style>
</head>
<body>
<header>
  <h1>Idle Code Redeemer</h1>
  <nav>
    {% for href, label in [('/', 'Dashboard'), ('/codes', 'Codes'), ('/accounts', 'Accounts'), ('/chests', 'Chests')] %}
      <a href="{{ href }}" {% if request.url.path == href %}class="active"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
