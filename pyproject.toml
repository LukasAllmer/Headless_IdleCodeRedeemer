[project]
name = "icr"
version = "0.1.0"
description = "Headless Idle Champions code redeemer for multiple accounts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "imap-tools>=1.15.0",
]

[project.scripts]
icr = "icr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["icr"]
strict = true
warn_return_any = false

# The core -- storage, API client, redeem orchestration -- is fully typed.
# The presentation layer is not: FastAPI route handlers and Typer commands are
# declarative, their return types are inferred by the framework, and annotating
# every one adds noise without catching anything.
[[tool.mypy.overrides]]
module = ["icr.cli", "icr.web.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
